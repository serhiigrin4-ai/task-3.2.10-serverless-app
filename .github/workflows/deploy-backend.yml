name: Deploy Backend (Lambdas)

on:
  push:
    branches:
      - 'feat/**'
      - dev
  pull_request:
    branches: [dev]

jobs:
  deploy-lambdas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Workspace Dependencies
        run: yarn install

      - name: Build Backend
        working-directory: ./packages/backend
        run: yarn build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create and Deploy Individual Lambda Packages
        working-directory: ./packages/backend
        run: |
          # Список твоїх функцій з папки dist
          FUNCTIONS=("createNote" "deleteNote" "getNote" "listNotes" "updateNote")
          
          for func in "${FUNCTIONS[@]}"; do
            echo "Processing $func..."
            
            # 1. Створюємо архів: кладемо app.js з папки dist/func в корінь архіву
            cd dist/$func
            zip -j ../../$func.zip app.js
            cd ../..
            
            # 2. Додаємо node_modules (необхідні для рантайму)
            zip -r $func.zip node_modules/
            
            # 3. Визначаємо ім'я в AWS. Перетворюємо listNotes -> notes-list
            if [ "$func" == "listNotes" ]; then
              AWS_NAME="notes-list"
            else
              # Видаляємо "Note", переводимо в нижній регістр і додаємо префікс
              BASE_NAME=$(echo $func | sed 's/Note//' | tr '[:upper:]' '[:lower:]')
              AWS_NAME="notes-$BASE_NAME"
            fi
            
            echo "Deploying to AWS Lambda: $AWS_NAME"
            aws lambda update-function-code --function-name $AWS_NAME --zip-file fileb://$func.zip
            
            # Невелика пауза, щоб AWS встиг опрацювати запит
            sleep 7
          done