name: Deploy Backend (Lambdas)

on:
  push:
    branches:
      - 'feat/**'
      - dev
  pull_request:
    branches: [dev]

jobs:
  deploy-lambdas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Workspace Dependencies
        run: yarn install

      - name: Zip Backend Code
        working-directory: ./packages/backend
        run: |
          cd src
          zip -r ../function.zip .
          cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update All Lambda Functions
        working-directory: ./packages/backend
        run: |
          aws lambda update-function-code --function-name notes-create --zip-file fileb://function.zip
          sleep 5
          aws lambda update-function-code --function-name notes-list --zip-file fileb://function.zip
          sleep 5
          aws lambda update-function-code --function-name notes-get --zip-file fileb://function.zip
          sleep 5
          aws lambda update-function-code --function-name notes-update --zip-file fileb://function.zip
          sleep 5
          aws lambda update-function-code --function-name notes-delete --zip-file fileb://function.zip